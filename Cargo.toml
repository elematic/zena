[workspace]
members = [
    "packages/workspace-hack",
    "packages/runtime-wasmtime",
    "packages/zena-run",
    "packages/cli",
    "packages/zenafx-render",
    "packages/zenafx",
    "packages/zenafx-web/engine",
]
default-members = [
    "packages/workspace-hack",
    "packages/runtime-wasmtime",
    "packages/zena-run",
    "packages/cli",
    "packages/zenafx-render",
    "packages/zenafx",
]
resolver = "2"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
wasmtime = { version = "50.0.1", features = ["cache", "component-model-async", "task-group-hook"] }
wasmtime-wasi = { version = "50.0.1", features = ["p3"] }
wasmtime-wasi-http = { version = "50.0.1", default-features = false, features = ["p3", "component-model-async"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.44", features = ["full"] }
winit = { version = "0.30" }
env_logger = "0.11"
log = "0.4"
wasi-webgpu-wasmtime = { git = "https://github.com/wasi-gfx/wasi-gfx-runtime" }
surface-wasmtime = { git = "https://github.com/wasi-gfx/wasi-gfx-runtime", features = ["winit", "surface-webgpu", "surface-frame-buffer"] }
frame-buffer-wasmtime = { git = "https://github.com/wasi-gfx/wasi-gfx-runtime" }

# The ZenaFX host primitives (docs/design/zenafx-ui.md §8). `softbuffer` is
# pinned to the version `frame-buffer-wasmtime` already resolves, so the two
# window paths share one crate.
taffy = "0.14"
parley = "0.11"
vello_cpu = "0.2"
softbuffer = "0.4.8"
# The platform's clipboard, for copying selected text and pasting into a
# field. Text only: the default features add image support.
arboard = { version = "3.7", default-features = false }

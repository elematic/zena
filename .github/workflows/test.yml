name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. A stacked one, based on another
  # pull request's branch, is tested on each push too, and its checks stay on
  # its head commit when the base is changed to main. With a `branches: [main]`
  # filter it had none, and retargeting does not start a run: that is an
  # `edited` event, not `synchronize`. Listening for `edited` is not the fix.
  # It fires on title and body edits too, and a job skipped by an `if` reports
  # success, so an edit would cover a failing required check with a passing
  # one.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Separate from the test job so a formatting slip reports in about a minute
  # rather than behind the half-hour suite. It needs neither cache: format:check
  # runs prettier directly rather than through wireit, and nothing here builds
  # Rust. The test job keeps its id, because rust-cache puts the job id in its
  # key (v0-rust-test-...) and renaming the job would orphan the entry.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # .#format is node alone, 97 paths and 301 MB, against the default
      # shell's 159 and 3.02 GB.
      - name: Install npm dependencies
        run: nix develop .#format --command npm ci

      - name: Check code formatting
        run: nix develop .#format --command npm run format:check

      - name: Check Nix npm dependencies
        run: nix build --no-link .#zena.npmDeps

      # `npm ci` accepts a lockfile whose record of a workspace's
      # dependencies is out of date, and `npm install` then rewrites it.
      # Wireit counts the lockfile as an input of every script, so that
      # rewrite makes the next build rerun everything.
      - name: Check package-lock.json matches the package.json files
        run: |
          nix develop .#format --command npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # The runner image ships its own Rust (1.98.1 on ubuntu-24.04), but the
      # build uses the dev shell's, which the flake pins separately and keeps
      # in two store paths. Prepend both bin directories so rust-cache keys on
      # the compiler that does the work. Keyed on the image's rustc instead,
      # the key would ignore a flake.lock toolchain bump and churn on every
      # image update. Realising the closure here costs nothing: the next step
      # would do it anyway.
      - name: Put the dev shell's cargo and rustc on PATH
        run: nix develop --command bash -c 'dirname "$(command -v rustc)"; dirname "$(command -v cargo)"' >> "$GITHUB_PATH"

      # Caches ~/.cargo and the dependency half of target/, keyed by
      # Cargo.lock and the rustc version. The workspace's own crates are
      # pruned out and recompile quickly; what this keeps is wasmtime,
      # cranelift and their LLVM bindings, which take minutes from source.
      # The cargo build runs on every CI run, because the four cargo wireit
      # scripts declare no inputs -- see packages/zena-run/package.json.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Every Rust crate depends on packages/workspace-hack, which gives
      # them one set of features for the dependencies they share, so the
      # three binaries share one wasmtime build (DEVELOPMENT.md, "Rust
      # dependencies"). A dependency change that leaves it stale still
      # builds, with a second copy of wasmtime, so nothing else would fail.
      - name: Check the workspace-hack crate
        run: nix develop --command bash -c 'cargo hakari generate --diff && cargo hakari manage-deps --dry-run'

      # There is deliberately no nix store cache here. 154 of the dev shell's
      # 159 paths come from cache.nixos.org, which a GitHub runner reaches
      # through a Fastly edge, and the 5 that do not are 58.5 MB
      # (`wasmtime`, the WIT corpus fetchzips, the shell derivation).
      # Measured both ways on this workflow: realising the whole closure cold
      # takes 33s, while restoring a 1,116 MB cache-nix-action entry takes 30s
      # and leaves 8s of substitution. Paying 30s to save 25s is a loss, and
      # it spends 1.1 GB of a 10 GB per-repository budget that the Rust cache
      # above puts to better use against a much slower baseline.
      #
      # magic-nix-cache was worse: it re-uploads paths it fetched from
      # cache.nixos.org, so each run stored the closure it had just restored
      # under a fresh key, reaching 17 copies of one 318,764,608 byte rustc
      # archive and 16.2 GB total (magic-nix-cache#154).
      - name: Setup Wireit GitHub Actions Caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install npm dependencies
        run: nix develop --command npm ci

      # Runs died mid-suite reporting only "The operation was canceled" or
      # "killed": the runner ran out of memory, and a kernel that kills the
      # runner agent leaves it no chance to log why. The sampler below
      # records the memory trajectory as it goes, which is how that was
      # found.
      #
      # Wireit runs two scripts per CPU by default, 8 on this 4 CPU / 16 GB
      # runner, and one script can hold 5 GiB: stage B, the compiler's test
      # module, and `zena test`, whose workers all run in one process.
      # Measured on 4 CPUs with every script rerunning (a standard library
      # edit), summing the RSS of the suite's processes: 8 at once peaked
      # at 19.5 GiB and spent 35s above 16 GiB; 4 at once peaked at 13.9 GiB,
      # and the suite took 270s against 276s, since 4 CPUs are busy either
      # way.
      - name: Run test suite
        env:
          WIREIT_PARALLEL: 4
        run: |
          (
            while true; do
              printf 'mem %s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/ {printf "used=%sMi available=%sMi ", $3, $7}'
              ps -eo rss=,comm= --sort=-rss | awk 'NR<=3 {printf "%s=%dMi ", $2, $1/1024}'
              echo
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          nix develop --command npm test


      - name: Compiler timings
        # Reported, never gated. A shared runner's numbers are too noisy
        # to fail a pull request on, and are still enough to see a phase
        # move by an order of magnitude. `npm test` has built the
        # compiler by now, which is the one this measures.
        #
        # Only on pushes to main: this is several minutes of compiling,
        # and the job it runs in is one a person waits on. A pull
        # request is not where the record is wanted; the history of main
        # is.
        if: github.event_name == 'push'
        run: nix develop --command npm run bench:compile

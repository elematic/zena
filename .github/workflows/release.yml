name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and smoke-test all release archives without creating a tag or GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Phase 1: Compile the CLI WebAssembly module, verify the version and
  # changelog against existing releases, generate out/stdlib_bundle.rs, and
  # pass the compiler self-hosting fixpoint check once on Linux.
  build-assets:
    name: Build CLI bundle & verify version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.verify-version.outputs.version }}
      tag: ${{ steps.verify-version.outputs.tag }}
      prerelease: ${{ steps.verify-version.outputs.prerelease }}
    env:
      WORKSPACE_CRATES: |
        target/zena-rust-sources.tsv
        target/release/zena-run
        target/release/zena
        target/release/*.d
        target/release/.fingerprint/workspace-hack-*
        target/release/.fingerprint/zena-*
        target/release/build/workspace-hack-*
        target/release/build/zena-*
        target/release/deps/*workspace_hack*
        target/release/deps/*zena_*

    steps:
      - name: Require main branch for non-dry-run releases
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Published releases must run from refs/heads/main (got ${GITHUB_REF}). Re-run with dry_run=true to test a branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch remote tags
        run: git fetch --tags --force

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Put the dev shell's cargo and rustc on PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c 'dirname "$(command -v rustc)"; dirname "$(command -v cargo)"' >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore the workspace crates
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WORKSPACE_CRATES }}
          key: rust-workspace-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml', 'scripts/ci-cargo-freshness.py', 'Cargo.lock', 'flake.lock', 'packages/workspace-hack/**', 'packages/zena-runtime/**', 'packages/zena-run/**', 'packages/cli/Cargo.toml', 'packages/cli/build.rs', 'packages/cli/src/**', 'packages/zenafx/Cargo.toml', 'packages/zenafx/src/**', 'packages/zenafx/tests/**', 'packages/zenafx/wit/**', 'packages/stdlib/zena/host-wit/**') }}
          restore-keys: rust-workspace-${{ runner.os }}-

      - name: Restore the Rust sources' times from the cached build
        run: python3 scripts/ci-cargo-freshness.py restore

      - name: Setup Wireit GitHub Actions Caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build CLI binary and module
        env:
          WIREIT_PARALLEL: 3
        run: nix develop --command npm run build -w @zena-lang/cli

      - name: Verify release version, changelog, and tag progression
        id: verify-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .zena packages/cli/out
          {
            git tag -l
            gh release list --limit 1000 --json tagName --jq '.[].tagName'
          } | sort -u > .zena/release-tags.txt
          rm -f .zena/github-output.txt
          ./target/release/zena run --dir . packages/cli/dev/check-release-version.zena \
            --tags-file .zena/release-tags.txt \
            --notes-out packages/cli/out/release-notes.md \
            --github-output .zena/github-output.txt
          cat .zena/github-output.txt >> "$GITHUB_OUTPUT"

      - name: Build bundle assets and verify compiler fixpoint
        env:
          WIREIT_PARALLEL: 3
        run: |
          nix develop --command bash -c '
            npm run build:bundle-assets -w @zena-lang/cli
            npm run test:fixpoint -w @zena-lang/compiler-zena
          '

      - name: Upload CLI bundle assets
        uses: actions/upload-artifact@v7
        with:
          name: cli-bundle-assets
          path: |
            packages/cli/out/zena.wasm
            packages/cli/out/stdlib_bundle.rs
            packages/cli/out/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Phase 2 & Phase 3: Compile standalone native binaries with the native OS
  # toolchain (not Nix, so binaries link against system libc/libSystem/MSVC
  # rather than /nix/store), package archives + .sha256 files, and smoke-test
  # each archive outside the repository checkout.
  build-native:
    name: Build ${{ matrix.target }}
    needs: build-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: zena
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: zena
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: zena
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: zena.exe

    steps:
      # out/stdlib_bundle.rs embeds packages/stdlib/zena/** via include_bytes!
      # and checks their hash against STDLIB_HASH computed on Linux. Keep LF
      # endings on Windows so the embedded bytes match byte-for-byte.
      - name: Disable git autocrlf
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download CLI bundle assets
        uses: actions/download-artifact@v8
        with:
          name: cli-bundle-assets
          path: packages/cli/out

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile standalone zena binary
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: cargo build --release --locked --target ${{ matrix.target }} -p zena --features bundled

      - name: Strip symbols and verify dynamic library links (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            strip -x "$BIN"
            codesign --force --sign - "$BIN"
            otool -L "$BIN"
            if otool -L "$BIN" | grep -q '/nix/store'; then
              echo "::error::Binary links against /nix/store"
              exit 1
            fi
          else
            strip "$BIN"
            ldd "$BIN"
            if ldd "$BIN" | grep -q '/nix/store'; then
              echo "::error::Binary links against /nix/store"
              exit 1
            fi
          fi

      - name: Package archive and SHA-256 checksum
        shell: bash
        env:
          TAG: ${{ needs.build-assets.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive_ext }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          rm -rf stage dist
          mkdir -p stage dist
          cp "target/${TARGET}/release/${BIN_NAME}" "stage/${BIN_NAME}"
          ARCHIVE="zena-${TAG}-${TARGET}.${EXT}"
          if [ "$EXT" = "tar.gz" ]; then
            chmod +x "stage/${BIN_NAME}"
            tar -C stage -czf "dist/${ARCHIVE}" "${BIN_NAME}"
          else
            pwsh -NoProfile -Command "Compress-Archive -Path 'stage/${BIN_NAME}' -DestinationPath 'dist/${ARCHIVE}' -Force"
          fi
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              HASH="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
            else
              HASH="$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')"
            fi
            printf '%s  %s\n' "$HASH" "$ARCHIVE" > "${ARCHIVE}.sha256"
          )
          cat "dist/${ARCHIVE}.sha256"

      - name: Smoke test standalone archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.build-assets.outputs.version }}
          TAG: ${{ needs.build-assets.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="zena-${TAG}-${TARGET}.tar.gz"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "${ARCHIVE}.sha256"
            else
              shasum -a 256 -c "${ARCHIVE}.sha256"
            fi
          )
          SMOKE_DIR="${RUNNER_TEMP}/zena-smoke"
          SMOKE_CACHE="${RUNNER_TEMP}/zena-smoke-cache"
          rm -rf "$SMOKE_DIR" "$SMOKE_CACHE"
          mkdir -p "$SMOKE_DIR"
          tar -xzf "dist/${ARCHIVE}" -C "$SMOKE_DIR"

          cd "$SMOKE_DIR"
          export ZENA_CACHE_DIR="$SMOKE_CACHE"

          VER_OUT="$(./zena --version)"
          echo "version output: $VER_OUT"
          case "$VER_OUT" in
            "zena ${VERSION} "*) ;;
            *)
              echo "::error::Unexpected --version output: $VER_OUT"
              exit 1
              ;;
          esac

          printf '%s\n' 'export function main(): void { console.log("Hello from Zena!"); }' > hello.zena
          RUN_OUT="$(./zena run hello.zena)"
          echo "run output: $RUN_OUT"
          if [ "$RUN_OUT" != "Hello from Zena!" ]; then
            echo "::error::Unexpected run output: $RUN_OUT"
            exit 1
          fi

      - name: Smoke test standalone archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.build-assets.outputs.version }}
          TAG: ${{ needs.build-assets.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "zena-$env:TAG-$env:TARGET.zip"
          $expectedLine = (Get-Content "dist/$archive.sha256" -Raw).Trim()
          $actualHash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedLine -ne "$actualHash  $archive") {
            throw "SHA-256 mismatch: expected '$actualHash  $archive', got '$expectedLine'"
          }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'zena-smoke'
          $smokeCache = Join-Path $env:RUNNER_TEMP 'zena-smoke-cache'
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          if (Test-Path $smokeCache) { Remove-Item -Recurse -Force $smokeCache }
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          Expand-Archive -Path "dist/$archive" -DestinationPath $smokeDir -Force

          Push-Location $smokeDir
          try {
            $env:ZENA_CACHE_DIR = $smokeCache
            $verOut = (& .\zena.exe --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "zena.exe --version exited with $LASTEXITCODE"
            }
            Write-Host "version output: $verOut"
            if (-not $verOut.StartsWith("zena $env:VERSION ")) {
              throw "Unexpected --version output: $verOut"
            }

            Set-Content -Path '.\hello.zena' -NoNewline -Value "export function main(): void { console.log('Hello from Zena!'); }`n"
            $runOut = (& .\zena.exe run .\hello.zena | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "zena.exe run exited with $LASTEXITCODE"
            }
            Write-Host "run output: $runOut"
            if ($runOut -ne 'Hello from Zena!') {
              throw "Unexpected run output: $runOut"
            }
          } finally {
            Pop-Location
          }

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/zena-${{ needs.build-assets.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/zena-${{ needs.build-assets.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Phase 2b: Bundle, test, and package the standalone VS Code extension VSIX.
  build-vscode:
    name: Build vscode-zena (.vsix)
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      vsix_version: ${{ steps.package-vsix.outputs.vsix_version }}
    env:
      WORKSPACE_CRATES: |
        target/zena-rust-sources.tsv
        target/release/zena-run
        target/release/zena
        target/release/*.d
        target/release/.fingerprint/workspace-hack-*
        target/release/.fingerprint/zena-*
        target/release/build/workspace-hack-*
        target/release/build/zena-*
        target/release/deps/*workspace_hack*
        target/release/deps/*zena_*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Put the dev shell's cargo and rustc on PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c 'dirname "$(command -v rustc)"; dirname "$(command -v cargo)"' >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: false

      - name: Restore the workspace crates
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WORKSPACE_CRATES }}
          key: rust-workspace-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml', 'scripts/ci-cargo-freshness.py', 'Cargo.lock', 'flake.lock', 'packages/workspace-hack/**', 'packages/zena-runtime/**', 'packages/zena-run/**', 'packages/cli/Cargo.toml', 'packages/cli/build.rs', 'packages/cli/src/**', 'packages/zenafx/Cargo.toml', 'packages/zenafx/src/**', 'packages/zenafx/tests/**', 'packages/zenafx/wit/**', 'packages/stdlib/zena/host-wit/**') }}
          restore-keys: rust-workspace-${{ runner.os }}-

      - name: Restore the Rust sources' times from the cached build
        run: python3 scripts/ci-cargo-freshness.py restore

      - name: Setup Wireit GitHub Actions Caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build and test vscode-zena
        env:
          WIREIT_PARALLEL: 2
        run: nix develop --command npm test -w vscode-zena

      - name: Package release VSIX and SHA-256 checksum
        id: package-vsix
        env:
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
        run: |
          VSIX_VERSION="$(jq -r '.version' packages/vscode-zena/package.json)"
          if ! [[ "$VSIX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packages/vscode-zena/package.json version must be plain X.Y.Z for Marketplace compatibility (got '${VSIX_VERSION}')"
            exit 1
          fi
          echo "vsix_version=${VSIX_VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          VSIX_FILE="vscode-zena-v${VSIX_VERSION}.vsix"
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS=(--pre-release)
          fi

          (
            cd packages/vscode-zena
            nix develop --command ../../node_modules/.bin/vsce package \
              --no-dependencies \
              "${PRERELEASE_ARGS[@]}" \
              -o "../../dist/${VSIX_FILE}"
          )

          (
            cd dist
            HASH="$(sha256sum "${VSIX_FILE}" | awk '{print $1}')"
            printf '%s  %s\n' "$HASH" "${VSIX_FILE}" > "${VSIX_FILE}.sha256"
          )
          cat "dist/${VSIX_FILE}.sha256"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-vscode-zena
          path: |
            dist/vscode-zena-v${{ steps.package-vsix.outputs.vsix_version }}.vsix
            dist/vscode-zena-v${{ steps.package-vsix.outputs.vsix_version }}.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  # Phase 2c: Build, test, and pack all public @zena-lang/* npm tarballs.
  build-npm:
    name: Pack npm packages
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm_version: ${{ steps.pack-npm.outputs.npm_version }}
      npm_count: ${{ steps.pack-npm.outputs.npm_count }}
    env:
      WORKSPACE_CRATES: |
        target/zena-rust-sources.tsv
        target/release/zena-run
        target/release/zena
        target/release/*.d
        target/release/.fingerprint/workspace-hack-*
        target/release/.fingerprint/zena-*
        target/release/build/workspace-hack-*
        target/release/build/zena-*
        target/release/deps/*workspace_hack*
        target/release/deps/*zena_*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Put the dev shell's cargo and rustc on PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c 'dirname "$(command -v rustc)"; dirname "$(command -v cargo)"' >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: false

      - name: Restore the workspace crates
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WORKSPACE_CRATES }}
          key: rust-workspace-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml', 'scripts/ci-cargo-freshness.py', 'Cargo.lock', 'flake.lock', 'packages/workspace-hack/**', 'packages/zena-runtime/**', 'packages/zena-run/**', 'packages/cli/Cargo.toml', 'packages/cli/build.rs', 'packages/cli/src/**', 'packages/zenafx/Cargo.toml', 'packages/zenafx/src/**', 'packages/zenafx/tests/**', 'packages/zenafx/wit/**', 'packages/stdlib/zena/host-wit/**') }}
          restore-keys: rust-workspace-${{ runner.os }}-

      - name: Restore the Rust sources' times from the cached build
        run: python3 scripts/ci-cargo-freshness.py restore

      - name: Setup Wireit GitHub Actions Caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build and test public npm packages
        env:
          WIREIT_PARALLEL: 2
        run: |
          nix develop --command bash -c '
            npm test -w @zena-lang/runtime
            npm test -w @zena-lang/compiler
            npm test -w @zena-lang/playground
            npm test -w @zena-lang/wasm-web-ui
          '

      - name: Pack npm tarballs in dependency order
        id: pack-npm
        run: |
          rm -rf dist-npm
          mkdir -p dist-npm

          PACKAGES=(
            "packages/runtime"
            "packages/compiler-js"
            "packages/codemirror"
            "packages/wasm-web-ui"
            "packages/playground"
          )

          COMPILER_VERSION="$(jq -r '.version' packages/compiler-js/package.json)"
          echo "npm_version=${COMPILER_VERSION}" >> "$GITHUB_OUTPUT"

          # This workflow releases the toolchain group, so it publishes the
          # group's units that are not held (.changes/config.json,
          # docs/design/change-files.md). The other packages are left out.
          RELEASED="$(jq -c '.groups.toolchain | (.units - (.held // []))' .changes/config.json)"

          MANIFEST='[]'
          for dir in "${PACKAGES[@]}"; do
            if [ "$(jq -n --argjson released "$RELEASED" --arg unit "${dir#packages/}" '$released | index($unit) != null')" != "true" ]; then
              echo "::notice::Not publishing ${dir}: it is held, or is not in the toolchain group (.changes/config.json)."
              continue
            fi
            if [ "$(jq -r '.private // false' "${dir}/package.json")" = "true" ]; then
              echo "::error::Expected ${dir} to be a public npm package, but private=true"
              exit 1
            fi
            pkg_name="$(jq -r '.name' "${dir}/package.json")"
            pkg_version="$(jq -r '.version' "${dir}/package.json")"
            if ! [[ "$pkg_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
              echo "::error::Invalid release version '${pkg_version}' in ${dir}/package.json"
              exit 1
            fi
            tarball="$(nix develop --command npm pack "./${dir}" --pack-destination dist-npm --silent | tail -n 1)"
            if [ ! -s "dist-npm/${tarball}" ]; then
              echo "::error::Packed tarball dist-npm/${tarball} is missing or empty"
              exit 1
            fi
            echo "Packed ${pkg_name}@${pkg_version} -> dist-npm/${tarball}"
            MANIFEST="$(jq -cn --argjson list "$MANIFEST" --arg name "$pkg_name" --arg version "$pkg_version" --arg tarball "$tarball" '$list + [{name: $name, version: $version, tarball: $tarball}]')"
          done

          printf '%s\n' "$MANIFEST" | jq . > dist-npm/manifest.json
          cat dist-npm/manifest.json
          echo "npm_count=$(jq 'length' dist-npm/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: |
            dist-npm/*.tgz
            dist-npm/manifest.json
          if-no-files-found: error
          retention-days: 7

  # Phase 4a: Aggregate platform archives and VSIX, create unversioned asset copies,
  # verify SHA256SUMS, and format the release notes (runs on dry_run too).
  assemble:
    name: Assemble release bundle
    needs: [build-assets, build-native, build-vscode, build-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: cli-bundle-assets
          path: release-meta

      - name: Download platform archives and VSIX
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create unversioned copies, SHA256SUMS, and release notes
        env:
          TAG: ${{ needs.build-assets.outputs.tag }}
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
          VSIX_VERSION: ${{ needs.build-vscode.outputs.vsix_version }}
          NPM_VERSION: ${{ needs.build-npm.outputs.npm_version }}
          NPM_COUNT: ${{ needs.build-npm.outputs.npm_count }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd dist

          TARGETS=(
            "aarch64-apple-darwin:tar.gz:macOS (Apple Silicon)"
            "x86_64-unknown-linux-gnu:tar.gz:Linux (x86_64)"
            "aarch64-unknown-linux-gnu:tar.gz:Linux (ARM64)"
            "x86_64-pc-windows-msvc:zip:Windows (x86_64)"
          )

          for entry in "${TARGETS[@]}"; do
            IFS=':' read -r target ext _label <<< "$entry"
            versioned="zena-${TAG}-${target}.${ext}"
            unversioned="zena-${target}.${ext}"
            if [ ! -f "$versioned" ] || [ ! -f "${versioned}.sha256" ]; then
              echo "::error::Missing expected build artifact ${versioned}"
              exit 1
            fi
            cp "$versioned" "$unversioned"
            hash="$(awk '{print $1}' "${versioned}.sha256")"
            printf '%s  %s\n' "$hash" "$unversioned" > "${unversioned}.sha256"
          done

          VSIX_VERSIONED="vscode-zena-v${VSIX_VERSION}.vsix"
          VSIX_UNVERSIONED="vscode-zena.vsix"
          if [ ! -f "$VSIX_VERSIONED" ] || [ ! -f "${VSIX_VERSIONED}.sha256" ]; then
            echo "::error::Missing expected VSIX artifact ${VSIX_VERSIONED}"
            exit 1
          fi
          cp "$VSIX_VERSIONED" "$VSIX_UNVERSIONED"
          VSIX_HASH="$(awk '{print $1}' "${VSIX_VERSIONED}.sha256")"
          printf '%s  %s\n' "$VSIX_HASH" "$VSIX_UNVERSIONED" > "${VSIX_UNVERSIONED}.sha256"

          LC_ALL=C sort -- *.sha256 > SHA256SUMS
          cat SHA256SUMS
          COUNT="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$COUNT" -ne 10 ]; then
            echo "::error::Expected 10 checksums in SHA256SUMS (4 CLI + 1 VSIX, versioned and unversioned), got ${COUNT}"
            exit 1
          fi
          sha256sum -c SHA256SUMS

          NPM_TAG_SUFFIX=""
          if [ "$PRERELEASE" = "true" ] || [[ "$NPM_VERSION" == *-* ]]; then
            NPM_TAG_SUFFIX="@next"
          fi

          # shellcheck disable=SC2016
          {
            cat ../release-meta/release-notes.md
            printf '\n\n<!-- zena-release-downloads -->\n\n---\n\n'
            printf '### Install\n\n'
            printf '**macOS and Linux:**\n\n```sh\ncurl -fsSL https://zena-lang.dev/install.sh | ZENA_VERSION=%s sh\n```\n\n' "$TAG"
            printf '**Windows (PowerShell):**\n\n```powershell\n$env:ZENA_VERSION = '\''%s'\''; irm https://zena-lang.dev/install.ps1 | iex\n```\n\n' "$TAG"
            printf 'Omit `ZENA_VERSION` to install the latest release.\n\n'
            printf '**VS Code Extension:**\n\n```sh\ncode --install-extension zena-lang.vscode-zena\n# Or from the attached VSIX:\ncode --install-extension %s\n```\n\n' "$VSIX_VERSIONED"
            if [ "${NPM_COUNT:-0}" -gt 0 ]; then
              printf '**npm Packages (`@zena-lang/*`):**\n\n```sh\nnpm install @zena-lang/compiler%s @zena-lang/runtime%s\n```\n\n' "$NPM_TAG_SUFFIX" "$NPM_TAG_SUFFIX"
            fi
            printf '### Downloads\n\n'
            printf '| Platform | Archive | SHA-256 |\n'
            printf '| --- | --- | --- |\n'
            for entry in "${TARGETS[@]}"; do
              IFS=':' read -r target ext label <<< "$entry"
              versioned="zena-${TAG}-${target}.${ext}"
              hash="$(awk '{print $1}' "${versioned}.sha256")"
              url="${REPO_URL}/releases/download/${TAG}/${versioned}"
              printf '| %s | [`%s`](%s) | `%s` |\n' "$label" "$versioned" "$url" "$hash"
            done
            vsix_url="${REPO_URL}/releases/download/${TAG}/${VSIX_VERSIONED}"
            printf '| VS Code Extension | [`%s`](%s) | `%s` |\n' "$VSIX_VERSIONED" "$vsix_url" "$VSIX_HASH"
            printf '\nUnversioned `zena-<target>.<ext>` and `vscode-zena.vsix` copies are also attached for `/releases/latest/download/` links on stable releases. Full checksum manifest: [`SHA256SUMS`](%s/releases/download/%s/SHA256SUMS) · All releases: [zena-lang.dev/releases](https://zena-lang.dev/releases/)\n' "$REPO_URL" "$TAG"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/zena-*
            dist/vscode-zena*
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  # Phase 4b: Tag the commit, publish the GitHub Release, and optionally publish
  # to npm, VS Code Marketplace, and Open VSX. Skipped on dry_run.
  publish:
    name: Publish GitHub Release
    needs: [build-assets, build-vscode, build-npm, assemble]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The only job that can publish. The environment is limited to main and
    # holds the variables and any secrets that publishing reads, and npm's
    # trusted publisher for each package names it, so nothing publishes from
    # another job, workflow or branch.
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download assembled release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist

      - name: Download npm tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: dist-npm

      - name: Verify SHA256SUMS before publishing
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Tag commit and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-assets.outputs.tag }}
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin"
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG} already exists"
            exit 1
          fi

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          gh release create "${TAG}" \
            dist/zena-* \
            dist/vscode-zena* \
            dist/SHA256SUMS \
            --title "Zena ${TAG}" \
            --notes-file dist/RELEASE_NOTES.md \
            "${PRERELEASE_FLAG[@]}"

      - name: Check registry credentials
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_TRUSTED_PUBLISHING: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          HAS_NPM="false"
          HAS_VSCE="false"
          HAS_OVSX="false"
          if [ -n "${NPM_TOKEN:-}" ] || [ "${NPM_TRUSTED_PUBLISHING:-}" = "true" ]; then
            HAS_NPM="true"
          else
            echo "::notice::Neither NPM_TOKEN secret nor NPM_TRUSTED_PUBLISHING=true variable is configured; skipping npm publish."
          fi
          if [ -n "${VSCE_PAT:-}" ] || [ "${VSCE_TRUSTED_PUBLISHING:-}" = "true" ]; then
            HAS_VSCE="true"
          else
            echo "::notice::Neither VSCE_PAT secret nor VSCE_TRUSTED_PUBLISHING=true variable is configured; skipping VS Code Marketplace publish."
          fi
          if [ -n "${OVSX_PAT:-}" ]; then
            HAS_OVSX="true"
          else
            echo "::notice::OVSX_PAT is not configured; skipping Open VSX publish."
          fi
          NEEDS_NIX="false"
          NEEDS_MARKETPLACE_DEPS="false"
          if [ "$HAS_VSCE" = "true" ] || [ "$HAS_OVSX" = "true" ]; then
            NEEDS_MARKETPLACE_DEPS="true"
          fi
          if [ "$HAS_NPM" = "true" ] || [ "$NEEDS_MARKETPLACE_DEPS" = "true" ]; then
            NEEDS_NIX="true"
          fi
          {
            echo "has_npm=${HAS_NPM}"
            echo "has_vsce=${HAS_VSCE}"
            echo "has_ovsx=${HAS_OVSX}"
            echo "needs_nix=${NEEDS_NIX}"
            echo "needs_marketplace_deps=${NEEDS_MARKETPLACE_DEPS}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix for registry CLI tools
        if: steps.creds.outputs.needs_nix == 'true'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Publish @zena-lang/* packages to npm
        if: steps.creds.outputs.has_npm == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
        run: |
          NPMRC="${RUNNER_TEMP}/.npmrc-publish"
          rm -f "$NPMRC"
          touch "$NPMRC"
          chmod 600 "$NPMRC"
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
          fi

          COUNT="$(jq 'length' dist-npm/manifest.json)"
          for ((i = 0; i < COUNT; i++)); do
            pkg_name="$(jq -r ".[$i].name" dist-npm/manifest.json)"
            pkg_version="$(jq -r ".[$i].version" dist-npm/manifest.json)"
            tarball="$(jq -r ".[$i].tarball" dist-npm/manifest.json)"

            if nix develop --command npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${pkg_version} (already published on npm)"
              continue
            fi

            dist_tag="latest"
            if [ "$PRERELEASE" = "true" ] || [[ "$pkg_version" == *-* ]]; then
              dist_tag="next"
            fi

            echo "Publishing ${pkg_name}@${pkg_version} with dist-tag '${dist_tag}'..."
            NPM_CONFIG_USERCONFIG="$NPMRC" nix develop --command npm publish \
              "dist-npm/${tarball}" \
              --access public \
              --provenance \
              --tag "$dist_tag"
          done
          rm -f "$NPMRC"

      - name: Install npm dependencies for marketplace CLI tools
        if: steps.creds.outputs.needs_marketplace_deps == 'true'
        run: nix develop --command npm ci

      - name: Publish VSIX to VS Code Marketplace
        if: steps.creds.outputs.has_vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_TRUSTED_PUBLISHING: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          VSIX_VERSION: ${{ needs.build-vscode.outputs.vsix_version }}
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
        run: |
          AUTH_ARGS=()
          if [ -n "${VSCE_PAT:-}" ]; then
            export VSCE_PAT
          elif [ "${VSCE_TRUSTED_PUBLISHING:-}" = "true" ]; then
            unset VSCE_PAT
            AUTH_ARGS=(--oidc)
          fi
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS=(--pre-release)
          fi
          nix develop --command ./node_modules/.bin/vsce publish \
            --packagePath "dist/vscode-zena-v${VSIX_VERSION}.vsix" \
            --skip-duplicate \
            "${AUTH_ARGS[@]}" \
            "${PRERELEASE_ARGS[@]}"

      - name: Publish VSIX to Open VSX Registry
        if: steps.creds.outputs.has_ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_VERSION: ${{ needs.build-vscode.outputs.vsix_version }}
          PRERELEASE: ${{ needs.build-assets.outputs.prerelease }}
        run: |
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS=(--pre-release)
          fi
          nix develop --command ./node_modules/.bin/ovsx publish \
            --packagePath "dist/vscode-zena-v${VSIX_VERSION}.vsix" \
            --skip-duplicate \
            "${PRERELEASE_ARGS[@]}"

[package]
name = "zenafx-render"
version = "0.0.2-preview.1"
edition = "2024"
description = "Platform-independent ZenaFX rendering engine: retained scene, taffy layout, parley text shaping, and vello_cpu rasterization."

[features]
default = []
# Discover installed OS fonts via fontique (fontconfig / CoreText / DirectWrite).
# Leave off on wasm32 where fonts are registered explicitly via `TextEngine::register_font`.
system-fonts = ["parley/system"]
# Derive wasmtime Component Model `ComponentType`, `Lift`, and `Lower` on the
# WIT record/variant types so the native `zenafx` host binds them directly.
wasmtime = ["dep:wasmtime"]

[dependencies]
taffy = "0.14"
parley = { version = "0.11", default-features = false, features = ["std"] }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "text", "u8_pipeline"] }
log = "0.4"
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["component-model"] }

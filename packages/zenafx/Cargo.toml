[package]
name = "zenafx"
version = "0.1.0"
edition = "2024"
description = "Graphical runtime for Zena components using wasi-gfx and WebGPU"

[[bin]]
name = "zfx"
path = "src/main.rs"

[dependencies]
zena-runtime = { path = "../zena-runtime" }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
winit = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
wasi-webgpu-wasmtime = { workspace = true }
surface-wasmtime = { workspace = true }
frame-buffer-wasmtime = { workspace = true }


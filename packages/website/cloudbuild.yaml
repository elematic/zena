# Cloud Build config for packaging and pushing the documentation site image.
#
# Submitted by `npm run deploy:image -w @zena-lang/website`, which builds the
# site on the host via Wireit first and passes packages/website as context.
#
# Cloud Build only packages the pre-built _site/ and serve-static.js into
# node:26-slim and pushes it to Artifact Registry.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE
      - .

images:
  - $_IMAGE

timeout: 300s

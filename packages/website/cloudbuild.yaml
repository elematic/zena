# Cloud Build config for packaging and pushing the documentation site image.
#
# Submitted by `npm run deploy:image -w @zena-lang/website`, which builds the
# site and server.wasm on the host via Wireit first and passes packages/website
# as context.
#
# Cloud Build packages the pre-built _site/, server.wasm, and zena-run into
# debian:trixie-slim (precompiling server.cwasm) and pushes to Artifact Registry.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE
      - .

images:
  - $_IMAGE

timeout: 300s

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 800" width="100%" height="100%" class="zena-venn-svg">
  <defs>
    <style>
      .zena-venn-svg {
        font-family: var(--rad-font-family-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);
      }

      /* Circle strokes and fills */
      .circle-human {
        fill: rgba(99, 102, 241, 0.07);
        stroke: #6366f1;
        stroke-width: 2.5;
      }
      .circle-ai {
        fill: rgba(6, 182, 212, 0.07);
        stroke: #0891b2;
        stroke-width: 2.5;
      }
      .circle-compilers {
        fill: rgba(245, 158, 11, 0.07);
        stroke: #d97706;
        stroke-width: 2.5;
      }
      .circle-wasm {
        fill: rgba(168, 85, 247, 0.07);
        stroke: #9333ea;
        stroke-width: 2.5;
      }

      /* Set Labels */
      .label-human {
        font-size: 32px;
        font-weight: 800;
        fill: #4f46e5;
        text-anchor: middle;
      }
      .label-ai {
        font-size: 32px;
        font-weight: 800;
        fill: #0891b2;
        text-anchor: middle;
      }
      .label-compilers {
        font-size: 32px;
        font-weight: 800;
        fill: #d97706;
        text-anchor: middle;
      }
      .label-wasm {
        font-size: 32px;
        font-weight: 800;
        fill: #9333ea;
        text-anchor: middle;
      }

      /* Center Brand Label: Zena */
      .label-zena {
        font-size: 42px;
        font-weight: 900;
        fill: var(--zena-c-brand-1, #6366f1);
        letter-spacing: -0.02em;
        text-anchor: middle;
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .circle-human { fill: rgba(129, 140, 248, 0.10); stroke: #818cf8; }
        .circle-ai { fill: rgba(34, 211, 238, 0.10); stroke: #22d3ee; }
        .circle-compilers { fill: rgba(251, 191, 36, 0.10); stroke: #fbbf24; }
        .circle-wasm { fill: rgba(192, 132, 252, 0.10); stroke: #c084fc; }

        .label-human { fill: #a5b4fc; }
        .label-ai { fill: #67e8f9; }
        .label-compilers { fill: #fde047; }
        .label-wasm { fill: #d8b4fe; }

        .label-zena { fill: #818cf8; }
      }

      /* When html.dark / :root.dark is present */
      :root.dark .circle-human, html.dark .circle-human { fill: rgba(129, 140, 248, 0.10); stroke: #818cf8; }
      :root.dark .circle-ai, html.dark .circle-ai { fill: rgba(34, 211, 238, 0.10); stroke: #22d3ee; }
      :root.dark .circle-compilers, html.dark .circle-compilers { fill: rgba(251, 191, 36, 0.10); stroke: #fbbf24; }
      :root.dark .circle-wasm, html.dark .circle-wasm { fill: rgba(192, 132, 252, 0.10); stroke: #c084fc; }

      :root.dark .label-human, html.dark .label-human { fill: #a5b4fc; }
      :root.dark .label-ai, html.dark .label-ai { fill: #67e8f9; }
      :root.dark .label-compilers, html.dark .label-compilers { fill: #fde047; }
      :root.dark .label-wasm, html.dark .label-wasm { fill: #d8b4fe; }

      :root.dark .label-zena, html.dark .label-zena { fill: #818cf8; }
    </style>
  </defs>

  <!-- =====================================================================
       FOUR OVERLAPPING CIRCLES (PERFECT 4-WAY SYMMETRY)
       Centers: (310, 290), (530, 290), (310, 510), (530, 510)
       Radius: 250
       Center: (420, 400)
       ===================================================================== -->
  <!-- Top-Left: Humans -->
  <circle cx="310" cy="290" r="250" class="circle-human" />
  <!-- Top-Right: AI -->
  <circle cx="530" cy="290" r="250" class="circle-ai" />
  <!-- Bottom-Left: Compiler -->
  <circle cx="310" cy="510" r="250" class="circle-compilers" />
  <!-- Bottom-Right: Wasm -->
  <circle cx="530" cy="510" r="250" class="circle-wasm" />

  <!-- =====================================================================
       SET LABELS ONLY
       ===================================================================== -->
  <text x="200" y="185" class="label-human">Humans</text>
  <text x="640" y="185" class="label-ai">AI</text>
  <text x="200" y="625" class="label-compilers">Compilers</text>
  <text x="640" y="625" class="label-wasm">Wasm</text>

  <!-- =====================================================================
       CENTER: ZENA
       ===================================================================== -->
  <text x="420" y="412" class="label-zena">Zena</text>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenaFX Web Runtime Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1117;
        --panel: #171a22;
        --border: #2a3040;
        --text: #e6eaf2;
        --muted: #8b93a7;
        --accent: #4c7dff;
        --accent-hover: #648eff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.01em;
        margin-right: 8px;
      }
      .brand span {
        color: var(--accent);
      }
      .controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      button,
      label.file-btn,
      select {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: #1f2430;
        color: var(--text);
        cursor: pointer;
      }
      button:hover,
      label.file-btn:hover {
        border-color: var(--accent);
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      label.file-btn input {
        display: none;
      }
      .spacer {
        flex: 1;
      }
      main {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }
      .viewport-frame {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 700px;
        resize: both;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #ffffff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .status-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 17, 23, 0.78);
        color: #fff;
        font-size: 14px;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      .status-overlay.hidden {
        opacity: 0;
      }
      footer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
        padding: 10px 18px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stat strong {
        color: var(--text);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Zena<span>FX</span> Web</div>
      <div class="controls" id="demo-buttons">
        <button data-demo="button" class="active">Button</button>
        <button data-demo="widgets">Widgets</button>
        <button data-demo="counter">Counter</button>
        <button data-demo="scroll">Scroll</button>
        <button data-demo="split">Split</button>
        <button data-demo="cursors">Cursors</button>
        <button data-demo="disclosure">Disclosure</button>
        <button data-demo="input">Input</button>
        <button data-demo="selection">Selection</button>
        <button data-demo="hello">Hello (Rust)</button>
      </div>
      <label class="file-btn">
        Load .wasm…
        <input id="file-input" type="file" accept=".wasm" />
      </label>
      <div class="spacer"></div>
      <label style="font-size: 12px; color: var(--muted)">
        Presenter:
        <select id="backend-select">
          <option value="canvas2d">Canvas 2D</option>
          <option value="webgpu">WebGPU</option>
        </select>
      </label>
    </header>

    <main>
      <div class="viewport-frame">
        <canvas id="zenafx-canvas"></canvas>
        <div class="status-overlay" id="status">Loading ZenaFX engine…</div>
      </div>
    </main>

    <footer>
      <div class="stat">Demo: <strong id="stat-demo">—</strong></div>
      <div class="stat">Frames: <strong id="stat-frames">0</strong></div>
      <div class="stat">Solves: <strong id="stat-solves">0</strong></div>
      <div class="stat">
        Guest entries: <strong id="stat-entries">0</strong>
      </div>
      <div class="stat">Events: <strong id="stat-events">0</strong></div>
      <div class="stat">Frame: <strong id="stat-ms">—</strong></div>
      <div class="stat">Backend: <strong id="stat-backend">—</strong></div>
      <div class="stat">Engine: <strong id="stat-engine-size">—</strong></div>
      <div class="stat">Component: <strong id="stat-comp-size">—</strong></div>
    </footer>

    <script type="module" src="./demo.js"></script>
  </body>
</html>

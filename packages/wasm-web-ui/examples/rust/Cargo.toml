[package]
name = "wasm-web-ui-example"
version = "0.0.0"
edition = "2021"
publish = false
description = "A Wasm Web UI element module written in Rust: the linear-memory extension of the protocol, with the support code a wasm-web-ui crate would provide."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Built on its own, for wasm32-unknown-unknown, not as part of the
# repository's Cargo workspace of native binaries.
[workspace]

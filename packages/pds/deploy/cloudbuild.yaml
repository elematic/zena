# Cloud Build config for the package host's image.
#
# Submitted by `npm run deploy:image -w @zena-lang/pds`, which builds
# pds.wasm and stages zena-run into deploy/ on the host first, and passes
# deploy/ as the context.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE
      - .

images:
  - $_IMAGE

timeout: 300s

// A schema that uses each feature the generator supports.
syntax = "proto3";

package zena.test.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/routing.proto";
import "zena/test/v1/options.proto";

option java_package = "dev.zena.test";

// Every scalar type.
message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  // A scalar whose absence is observable.
  optional int32 maybe = 16;
}

/*
 * A color.
 */
enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

// A tree node.
message Node {
  // The node's name. Every request must set it.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  repeated Node children = 2;
  map<string, Node> by_name = 3;
  map<int32, string> labels = 4;
  repeated int32 numbers = 5;
  repeated Color colors = 6;
  repeated string tags = 7;
  repeated sint64 unpacked = 8 [packed = false];
  // Set by the server.
  google.protobuf.Timestamp created = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  Color color = 10;

  // What the node holds.
  oneof value {
    string text = 11;
    int64 count = 12;
    Node child = 13;
    Color shade = 14;
  }

  // Something nested.
  message Inner {
    enum Kind {
      KIND_UNSPECIFIED = 0;
      BIG = 1;
    }
    Kind kind = 1;
    string label = 3;
    reserved 2, 5 to 7;
    reserved "old";
  }
  Inner inner = 15;
  // Fields named like Zena keywords.
  int32 type = 16;
  string from = 17;
  repeated bytes blobs = 18;
}

// A service with one of each kind of method.
service Things {
  option (default_host) = "things.example.com";

  // Gets a node.
  rpc GetNode(Node) returns (Node) {
    option (google.api.http) = {
      get: "/v1/{name=nodes/*}"
      additional_bindings { post: "/v1/nodes:get" body: "*" }
    };
  }

  // Lists a node's descendants.
  rpc ListNodes(Node) returns (stream Node) {
    option (google.api.http) = {
      post: "/v1/{name=nodes/*}:list"
      body: "*"
    };
  }

  // Routed by explicit parameters rather than its HTTP rule.
  rpc RouteNode(Node) returns (Node) {
    option (google.api.http) = {
      post: "/v1/{name=nodes/*}:route"
      body: "*"
    };
    option (google.api.routing) = {
      routing_parameters { field: "name" path_template: "projects/{project=*}/**" }
      routing_parameters {
        field: "name"
        path_template: "projects/*/zones/{zone=*}/**"
      }
      routing_parameters { field: "inner.label" }
    };
  }

  // Streams requests, routed by the first.
  rpc Upload(stream Node) returns (Node) {
    option (google.api.routing) = {
      routing_parameters { field: "name" path_template: "{node=nodes/*}" }
    };
  }

  rpc Exchange(stream Node) returns (stream Node);
}

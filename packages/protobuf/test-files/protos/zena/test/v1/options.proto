// Options for everything.proto, declared here so that protoc accepts it.
// The generator skips `extend` blocks and reads options by name.
syntax = "proto3";

package zena.test.v1;

import "google/protobuf/descriptor.proto";

message HttpRule {
  string get = 1;
  string post = 2;
  string body = 3;
  repeated HttpRule additional_bindings = 4;
}

extend google.protobuf.ServiceOptions {
  string default_host = 50001;
}

extend google.protobuf.MethodOptions {
  HttpRule http = 50002;
}

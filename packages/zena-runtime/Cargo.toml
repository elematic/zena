[package]
name = "zena-runtime"
version = "0.1.0"
edition = "2024"
description = "Host support for running compiled Zena modules on wasmtime: the imports the zena-cli compilation target expects beyond WASI"

[dependencies]
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
bytes = "1"

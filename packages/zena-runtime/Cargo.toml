[package]
name = "zena-runtime"
version = "0.1.0"
edition = "2024"
description = "Host support for running compiled Zena modules on wasmtime: the imports the zena-cli compilation target expects beyond WASI"

[dependencies]
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
http = "1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
http-body-util = "0.1"
bytes = "1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
tower-service = "0.3.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
http-body = "1"

[dev-dependencies]
rcgen = "0.14.10"

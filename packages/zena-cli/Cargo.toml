[package]
name = "zena-cli"
version = "0.1.0"
edition = "2024"
description = "The zena command: runs the CLI module on wasmtime"

[features]
# Embed the standard library and the CLI module in the binary, for a copy
# that runs outside a Zena repository. The build script requires
# out/stdlib_bundle.rs when this is on and ignores it when it is off, so
# which binary a command produces is a property of the command.
bundled = []

[dependencies]
zena-runtime = { path = "../zena-runtime" }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }

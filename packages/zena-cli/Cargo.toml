[package]
name = "zena-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for the Zena self-hosted compiler"

[dependencies]
wasmtime = { version = "46.0.0", features = ["cache"] }
wasmtime-wasi = "46.0.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0.0"
walkdir = "2.5"
rayon = "1.10"
glob = "0.3"
